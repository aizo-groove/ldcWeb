name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20   # Astro 4 ; voir l'issue de migration vers Node 22 / Astro 5
          cache: npm
      - run: npm ci
      - run: npm run build
